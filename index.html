<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attaque des Maths" />
    <meta
      name="description"
      content="Un jeu de plateforme pour apprendre le calcul en s'amusant (7-10 ans) — jouable au clavier ou au doigt."
    />
    <title>Ben &amp; Alice : l'Attaque des Maths</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="game-container" tabindex="-1"></div>

    <!-- Manettes tactiles (affichées uniquement pendant une partie, sur écran tactile) -->
    <div id="touch-controls" aria-hidden="true" hidden></div>

    <!-- Invitation à tourner le téléphone en mode portrait -->
    <div id="rotate-hint" role="dialog" aria-labelledby="rotate-title" hidden>
      <div class="rotate-phone" aria-hidden="true">📱</div>
      <p id="rotate-title">Tourne ton téléphone<br />pour jouer en grand !</p>
      <button id="rotate-dismiss" type="button">Jouer quand même</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
